#                                 INFO
# * The warmup value is in seconds. Set it to 0 to disable it entirely.
# * For custom max home caps for ranks, use the "ultimatehomes.sethome.max.<max>" permission with a plugin like LuckPerms. Maximum permissions do not stack; only the highest inherited node will apply. For unltimited homes, use the "ultimatehomes.sethome.unlimited" permission. Permission values will always take priority over the defaultMaxHomes amount. All the other permissions can be found on the plugins page (link above)
# * "Unsafe" are locations deemed risky, either very close to lava, in the air, or on other non-solid blocks
# * Alternate command executor listens on command preprocess and disables the official command event to attempt to override other plugins with the same commands. If you're having conflict issues, try enabling this option and reloading the plugin with '/uh reload'. Note that this may cause issues with other plugins blocking execution of UltimateHome's commands
# * Home worlds are the allowed/disallowed worlds for creating and teleporting to homes. The type can be either "WHITELIST" (only worlds in the list are allowed for home commands) or "BLACKLIST" (all worlds are allowed except the ones in the list)
# -------------------------------------------------------------------------------
defaultMaxHomes: 1
warmup: 3
respawnAtHome: true
confirmUnsafeTeleports: true
blockCreatingUnsafeSethomes: true
considerMidAirUnsafe: true
alternateCommandExecutor: false
enableDeleteAllHomesFromPlayerAdminCommand: false
enableDeleteAllHomesInWorldAdminCommand: false
showDetectedConflictWarning: true
homeWorlds:
  type: BLACKLIST
  list:
    - "exampleDisabledWorld"