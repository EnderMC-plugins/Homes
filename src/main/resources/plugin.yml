name: Homes
authors: [kixmc, herrlamatv]
version: ${project.version}
api-version: '1.20'
main: com.kixmc.homes.Homes
commands:
  sethome:
    description: Set a personal home. (waypoint)
  home:
    description: Teleport to a personal home. (waypoint)
  homes:
    description: List your or another players homes.
  delhome:
    description: Delete your or another players home.
  homesadmin:
    description: Manage the homes of all players in a GUI or reload the config.
    usage: /homesadmin [reload]
permissions:
  homes.sethome:
    default: true
  homes.home:
    default: true
  homes.homes:
    default: true
  homes.delhome:
    default: true
  homes.homes.other:
    default: op
  homes.home.other:
    default: op
  homes.delhome.other:
    default: op
  homes.sethome.unlimited:
    default: op
  homes.warmup.bypass:
    default: op
  homes.cooldown.bypass:
    default: op
  homes.cooldown.5:
    default: false
  homes.cooldown.10:
    default: false
  homes.cooldown.15:
    default: false
  homes.cooldown.30:
    default: false
  homes.cooldown.45:
    default: false
  homes.cooldown.60:
    default: false
  homes.cooldown.90:
    default: false
  homes.cooldown.120:
    default: false
  homes.admin:
    default: op
