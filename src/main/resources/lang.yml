      - '&f/delhome [name] || <player> <name>'
      - '&f/homes [player]'
      - ''
      - '&bManagement Commands:'
      - ''
      - '&f/uh deleteallhomesfromplayer <player>'
      - '&f/uh deleteallhomesinworld <world name>'
      - ''
      - '&7<required> [optional] | or |'
      - '&f&m+-----------------------------+'